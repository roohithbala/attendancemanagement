<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        h1 {
            color: #333;
        }
        input, button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            color: #fff;
            background-color: #007BFF;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Add Student</h1>
    <form id="addStudentForm">
        <input type="text" id="studentId" placeholder="Student ID" required />
        <input type="text" id="studentName" placeholder="Student Name" required />
        <input type="number" id="studentAge" placeholder="Student Age" required />
        <button type="submit">Add Student</button>
    </form>

    <script>
        document.getElementById('addStudentForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const studentId = document.getElementById('studentId').value;
            const studentName = document.getElementById('studentName').value;
            const studentAge = document.getElementById('studentAge').value;

            const response = await fetch('/api/students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: studentId, name: studentName, age: studentAge })
            });

            if (response.ok) {
                alert('Student added successfully!');
                document.getElementById('addStudentForm').reset(); // Reset the form
            } else {
                alert('Failed to add student. Please try again.');
            }
        });
    </script>
</body>
</html>
